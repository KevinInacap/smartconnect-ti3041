<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SmartConnect{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", sans-serif;
      color: #183036;
      background: #f3f6f5;
    }
    * { box-sizing: border-box }
    body { margin: 0 }
    .barra { background: #123f42; color: white }
    .barra > div, main { max-width: 76rem; margin: auto; padding: 0 1.5rem }
    .barra > div, nav, .sesion { display: flex; align-items: center; gap: 1rem }
    .barra > div { justify-content: space-between; min-height: 4.5rem; flex-wrap: wrap; padding-block: .85rem }
    nav { flex-wrap: wrap }
    .marca { font-size: 1.3rem; font-weight: 750; letter-spacing: -.04em; text-decoration: none }
    .barra a { color: inherit }
    .sesion { border-left: 1px solid #6f9092; padding-left: 1rem }
    .salir { background: transparent; color: white; border: 1px solid #91b3b4; border-radius: .4rem; padding: .4rem .65rem }
    main { padding-block: clamp(1.8rem, 5vw, 4rem) }
    h1 { font-size: clamp(1.9rem, 4.2vw, 3.2rem); line-height: 1.1; letter-spacing: -.045em; margin: 0 0 .6rem }
    p { margin: .55rem 0; line-height: 1.5; color: #455e62 }
    button, input { font: inherit }
    button { cursor: pointer }
    :focus-visible { outline: 3px solid #1f94c2; outline-offset: 3px }
    .tarjeta { background: white; border: 1px solid #cbd9d8; border-radius: .8rem }
    .ingreso { max-width: 28rem; margin: 1.5rem auto; padding: clamp(1.5rem, 5vw, 2.5rem) }
    .ingreso h1 { font-size: 2rem }
    .ingreso label { display: block; font-weight: 600; margin: 1.2rem 0 .4rem }
    .ingreso input:not([type=hidden]) { width: 100%; padding: .7rem; border: 1px solid #859c9d; border-radius: .35rem }
    .ingreso button { margin-top: 1.5rem; background: #135b58; color: white; padding: .7rem 1.2rem; border: 0; border-radius: .35rem }
    .error { color: #9b3829 }
    .estado { margin: 1.4rem 0 .55rem; font-size: .9rem }
    .desplazable { overflow: auto }
    table { width: 100%; border-collapse: collapse; font-size: .94rem }
    th, td { padding: .9rem 1rem; text-align: left; vertical-align: middle }
    th { font-size: .84rem; background: #e9f1f0; color: #254e4f }
    td { border-top: 1px solid #e1e8e7 }
    tbody tr:hover { background: #f7faf9 }
    .secundario { color: #526c70; font-size: .83rem; display: block; margin-top: .2rem }
    time, code { white-space: nowrap; font-variant-numeric: tabular-nums }
    .decision { border-radius: .35rem; padding: .2rem .55rem; font-weight: 650; display: inline-block }
    .si { color: #145442; background: #dff1e8 }
    .no { color: #883b2e; background: #f9e6de }
    .vacio { padding: 2rem }
    form { margin: 0 }
    @media (max-width: 600px) {
      .barra > div, main { padding-inline: 1rem }
      .barra > div, nav { gap: .7rem }
      th, td { padding: .7rem }
    }
  </style>
</head>
<body>
<header class="barra">
  <div>
    <a class="marca" href="{% url 'historial-web' %}">SmartConnect</a>
    <nav aria-label="Principal">
      <a href="{% url 'docs' %}">Documentación de la API</a>
      {% if user.is_authenticated %}
        <span class="sesion">{{ user.username }}</span>
        <form action="{% url 'salir-historial' %}" method="post">
          {% csrf_token %}<button class="salir" type="submit">Salir</button>
        </form>
      {% endif %}
    </nav>
  </div>
</header>
<main>{% block contenido %}{% endblock %}</main>
</body>
</html>
