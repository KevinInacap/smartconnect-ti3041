openapi: 3.0.3
info:
  title: SmartConnect · API residencial
  version: 1.0.0
  description: Catálogo, asignaciones y control de acceso. Horas ISO 8601.
paths:
  /api/accesos/solicitudes/:
    post:
      operationId: accesos_solicitudes_create
      tags:
      - accesos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intento'
          description: ''
  /api/historial/:
    get:
      operationId: historial_list
      parameters:
      - in: query
        name: fecha
        schema:
          type: string
          format: date
      - in: query
        name: persona
        schema:
          type: integer
          minimum: 1
      - in: query
        name: punto
        schema:
          type: integer
          minimum: 1
      - in: query
        name: terreno
        schema:
          type: integer
          minimum: 1
      tags:
      - historial
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Intento'
          description: ''
  /api/personas/:
    get:
      operationId: personas_list
      tags:
      - personas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Persona'
          description: ''
    post:
      operationId: personas_create
      tags:
      - personas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PersonaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
          description: ''
  /api/personas/{id}/:
    get:
      operationId: personas_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este persona.
        required: true
      tags:
      - personas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
          description: ''
    put:
      operationId: personas_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este persona.
        required: true
      tags:
      - personas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PersonaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
          description: ''
    patch:
      operationId: personas_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este persona.
        required: true
      tags:
      - personas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPersonaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPersonaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPersonaRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
          description: ''
    delete:
      operationId: personas_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este persona.
        required: true
      tags:
      - personas
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
