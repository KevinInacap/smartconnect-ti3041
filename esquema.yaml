      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViviendaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ViviendaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ViviendaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vivienda'
