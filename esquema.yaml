          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ViviendaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vivienda'
