          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPuntoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Punto'
          description: ''
    delete:
      operationId: puntos_acceso_destroy
      parameters:
      - in: path
        name: id
