  /api/viviendas/{id}/asignaciones/:
    get:
      operationId: viviendas_asignaciones_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este vivienda.
        required: true
      tags:
      - viviendas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participacion'
          description: ''
    post:
      operationId: viviendas_asignaciones_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este vivienda.
        required: true
      tags:
      - viviendas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AsignacionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsignacionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participacion'
          description: ''
components:
  schemas:
    AsignacionRequest:
      type: object
      properties:
        persona:
          type: integer
        rol:
          $ref: '#/components/schemas/AsignacionRolEnum'
      required:
      - persona
      - rol
    AsignacionRolEnum:
      enum:
      - arrendatario
      - conviviente
      type: string
      description: |-
        * `arrendatario` - arrendatario
        * `conviviente` - conviviente
    Intento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
        punto:
          type: integer
          readOnly: true
        terreno:
          type: integer
          readOnly: true
        persona:
          type: integer
          readOnly: true
          nullable: true
        medio:
          allOf:
          - $ref: '#/components/schemas/IntentoMedioEnum'
          readOnly: true
        permitido:
          type: boolean
          readOnly: true
        motivo:
          type: string
          readOnly: true
        huella:
          type: string
          readOnly: true
      required:
      - fecha
      - huella
      - id
      - medio
      - motivo
      - permitido
      - persona
      - punto
      - terreno
    IntentoMedioEnum:
      enum:
      - app
      - rfid
      type: string
      description: |-
        * `app` - App
        * `rfid` - RFID
    Participacion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        persona:
          type: integer
          readOnly: true
        vivienda:
          type: integer
          readOnly: true
        rol:
          allOf:
          - $ref: '#/components/schemas/ParticipacionRolEnum'
          readOnly: true
        creada:
          type: string
          format: date-time
          readOnly: true
      required:
      - creada
      - id
      - persona
      - rol
      - vivienda
    ParticipacionRolEnum:
      enum:
      - propietario_administrador
      - propietario
      - arrendatario
      - conviviente
      type: string
      description: |-
        * `propietario_administrador` - Propietario administrador
        * `propietario` - Propietario
        * `arrendatario` - Arrendatario
        * `conviviente` - Conviviente
    PatchedPersonaRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        nombre:
          type: string
          minLength: 1
          maxLength: 100
    PatchedPuntoRequest:
      type: object
      properties:
        terreno:
          type: integer
        codigo:
          type: string
          minLength: 1
          maxLength: 40
        nombre:
          type: string
          minLength: 1
          maxLength: 100
    PatchedTerrenoRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        administrador:
          type: integer
    PatchedViviendaRequest:
      type: object
      properties:
        terreno:
          type: integer
        codigo:
          type: string
          minLength: 1
          maxLength: 40
        tipo:
          $ref: '#/components/schemas/TipoEnum'
    Persona:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        nombre:
          type: string
          maxLength: 100
      required:
      - codigo
      - id
      - nombre
    PersonaRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        nombre:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - codigo
      - nombre
    Punto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        terreno:
          type: integer
        codigo:
          type: string
          maxLength: 40
        nombre:
          type: string
          maxLength: 100
      required:
      - codigo
      - id
      - nombre
      - terreno
    PuntoRequest:
      type: object
      properties:
        terreno:
          type: integer
        codigo:
          type: string
          minLength: 1
          maxLength: 40
        nombre:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - codigo
      - nombre
      - terreno
    SolicitudMedioEnum:
      enum:
      - app
      - rfid
      type: string
      description: |-
        * `app` - app
        * `rfid` - rfid
    SolicitudRequest:
      type: object
      properties:
        punto:
          type: integer
        medio:
          $ref: '#/components/schemas/SolicitudMedioEnum'
        cerca:
          type: boolean
        uid:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - medio
      - punto
    Terreno:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        codigo:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        nombre:
          type: string
          maxLength: 100
        administrador:
          type: integer
      required:
      - administrador
      - codigo
      - id
      - nombre
    TerrenoRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        administrador:
          type: integer
      required:
      - administrador
      - codigo
      - nombre
    TipoEnum:
      enum:
      - casa
      - departamento
      type: string
      description: |-
        * `casa` - Casa
        * `departamento` - Departamento
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
