        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedViviendaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedViviendaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedViviendaRequest'
      security:
      - jwtAuth: []
      responses:
