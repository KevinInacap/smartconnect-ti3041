          description: ''
    put:
      operationId: puntos_acceso_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este punto acceso.
        required: true
      tags:
      - puntos-acceso
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuntoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PuntoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PuntoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
