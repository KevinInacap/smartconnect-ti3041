name: Verificar API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - name: Validar el contrato OpenAPI versionado
        run: |
          python manage.py spectacular --validate --fail-on-warn --file esquema.yaml
          git diff --exit-code -- esquema.yaml
      - run: python manage.py test -v 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recorrer la API con Apidog CLI
        shell: bash
        run: |
          set -euo pipefail
          python manage.py seed_demo --aula > /tmp/smartconnect-semilla.log
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/smartconnect.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor" || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8000/api/esquema/ -o /dev/null
          npx --yes --package=apidog-cli@2.2.12 apidog run apidog/SmartConnect.json --lang en
          npx --yes --package=apidog-cli@2.2.12 apidog run apidog/Rubrica.json --lang en
